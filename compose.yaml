# Please refer https://aka.ms/HTTPSinContainer on how to setup an https developer certificate for your ASP.NET Core service.
#
# The Postgres password is read from the WHYLAND_POSTGRES_PASSWORD variable.
# Compose loads it automatically from the .env file next to this file
# (see .env.example). Use a strong, non-default value outside local development.

services:
  postgres:
    image: postgres:18-alpine
    environment:
      - POSTGRES_DB=whyland
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${WHYLAND_POSTGRES_PASSWORD:?Set WHYLAND_POSTGRES_PASSWORD (see .env.example)}
    volumes:
      - whyland-postgres-data:/var/lib/postgresql
    # Published on 5433 so it never conflicts with a local Postgres running on the host.
    ports:
      - 5433:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d whyland"]
      interval: 5s
      timeout: 5s
      retries: 10

  whylandsms:
    image: whylandsms
    build:
      context: .
      dockerfile: src/Whyland.Sms/Dockerfile
    # Published on 5090 so the dashboard and the message feed are reachable from the host.
    ports:
      - 5090:8080
    environment:
      - SmsService__ApiKey=${WHYLAND_SMS_API_KEY:?Set WHYLAND_SMS_API_KEY (see .env.example)}
      # Dashboard sign-in. Without a password the panel refuses to open, by design.
      - SmsService__PanelUsername=${WHYLAND_SMS_PANEL_USERNAME:-panel}
      - SmsService__PanelPassword=${WHYLAND_SMS_PANEL_PASSWORD:?Set WHYLAND_SMS_PANEL_PASSWORD (see .env.example)}

  whylandweb:
    image: whylandweb
    build:
      context: .
      dockerfile: src/Whyland.Web/Dockerfile
    ports:
      - 5000:8080
    environment:
      - ConnectionStrings__Postgres=Host=postgres;Port=5432;Database=whyland;Username=postgres;Password=${WHYLAND_POSTGRES_PASSWORD:?Set WHYLAND_POSTGRES_PASSWORD (see .env.example)}
      - Sms__Provider=WhylandSms
      - SmsProvider__BaseUrl=http://whylandsms:8080
      - SmsProvider__ApiKey=${WHYLAND_SMS_API_KEY:?Set WHYLAND_SMS_API_KEY (see .env.example)}
    depends_on:
      postgres:
        condition: service_healthy
      whylandsms:
        condition: service_started

volumes:
  whyland-postgres-data:
